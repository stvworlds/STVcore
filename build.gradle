plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.6"
    id("com.google.protobuf") version "0.9.5"
}

group = 'net.maksim6opka'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven { url 'https://nexus.scarsz.me/content/groups/public/' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")

    compileOnly "me.clip:placeholderapi:2.11.6"
    compileOnly 'net.luckperms:api:5.4'
    implementation("net.dv8tion:JDA:6.4.2")
    compileOnly 'com.discordsrv:discordsrv:1.28.0'

    runtimeOnly 'io.grpc:grpc-netty-shaded:1.82.1'
    implementation 'io.grpc:grpc-protobuf:1.82.1'
    implementation 'io.grpc:grpc-stub:1.82.1'
    implementation("com.google.protobuf:protobuf-java:4.29.0")
    compileOnly("javax.annotation:javax.annotation-api:1.3.2")

}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.29.0"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.82.1"
        }
    }
    generateProtoTasks {
        all().configureEach {
            plugins {
                grpc {}
            }
        }
    }
}

tasks {
    shadowJar {
        archiveClassifier.set("")
    }
    runServer {
        minecraftVersion("1.21.11")
    }
    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
